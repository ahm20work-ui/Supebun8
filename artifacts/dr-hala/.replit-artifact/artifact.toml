kind = "web"
previewPath = "/"
title = "Dr. Hala"
description = "An Arabic-first personal study and productivity sanctuary for Hala, with tasks, habits, exam countdowns, focus sessions, calendar, and daily encouragement."
version = "1.0.0"
id = "artifacts/dr-hala"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24973

[services.development]
run = "pnpm --filter @workspace/dr-hala run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dr-hala", "run", "build" ]
serve = "static"
publicDir = "artifacts/dr-hala/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24973"
BASE_PATH = "/"
